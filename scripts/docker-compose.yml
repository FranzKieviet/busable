version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: busable-local-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: